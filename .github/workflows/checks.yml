name: checks
# Human is handling downloads. Enable push/PR runs after committing the lockfile.
on: workflow_dispatch
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the human-generated lockfile
        run: test -f package-lock.json || (echo 'Run npm install locally and commit package-lock.json before enabling CI'; exit 1)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
